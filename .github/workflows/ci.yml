name: CI - Build and Push ECS Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  # Debe coincidir con DEFAULT_REGION en infra/sagrilaft/lib/deployment-constants.ts.
  # YAML no puede importar esa constante; si cambia la región, actualizar aquí también.
  AWS_REGION: us-east-1
  # Debe coincidir con TARGET_ACCOUNT del catálogo de infraestructura.
  AWS_ACCOUNT_ID: "874641912777"

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  build-and-push:
    name: Build and Push ECS Images
    concurrency:
      group: ecr-prod-${{ github.sha }}
      cancel-in-progress: false
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validar plantillas .env (validate_envs.py)
        run: python3 scripts/validate_envs.py

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up publisher Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish immutable SHA images
        env:
          IMAGE_TAG: ${{ github.sha }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_PORTAL_INTERNO_URL: ${{ vars.VITE_PORTAL_INTERNO_URL }}
          VITE_RAZON_SOCIAL: ${{ vars.VITE_RAZON_SOCIAL }}
          VITE_CORREO_DATOS: ${{ vars.VITE_CORREO_DATOS }}
          VITE_KEYCLOAK_URL: ${{ vars.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ vars.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_PORTAL_URL: ${{ vars.KEYCLOAK_PORTAL_URL }}
          KEYCLOAK_FORMULARIO_URL: ${{ vars.KEYCLOAK_FORMULARIO_URL }}
        run: |
          python3 scripts/build_and_push_ecr_images.py \
            --environment prod --from-environment \
            --account "$AWS_ACCOUNT_ID" --region "$AWS_REGION" \
            --tag "$IMAGE_TAG" --manifest "$RUNNER_TEMP/ecr-manifest.json"

      - name: Preserve publication evidence including partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecr-manifest-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ecr-manifest.json
          if-no-files-found: warn
