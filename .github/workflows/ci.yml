name: CI - Build and Push ECS Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente para publicar imágenes
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read
  id-token: write

env:
  # Debe coincidir con DEFAULT_REGION en infra/sagrilaft/lib/deployment-constants.ts.
  # YAML no puede importar esa constante; si cambia la región, actualizar aquí también.
  AWS_REGION: us-east-1
  # Variable de repositorio (Settings > Secrets and variables > Actions > Variables).
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  gitleaks:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo: gitleaks revisa todos los commits, no solo el último

      - name: Gitleaks
        # Imagen fijada por versión y digest (v8.30.1, verificado en Docker Hub)
        # en lugar de la etiqueta mutable, para que el CI no cambie de
        # comportamiento sin aviso. Para actualizar: revisar
        # hub.docker.com/r/zricethezav/gitleaks/tags y reemplazar tag + digest juntos.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source="/repo" --redact -v

  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Auditoría de dependencias (pip-audit, informativo)
        # No bloquea el pipeline: hoy hay vulnerabilidades conocidas sin corrección
        # disponible en algunas dependencias. Se deja en modo reporte hasta que se
        # decida un plan de actualización; revisar el resumen del job para el detalle.
        continue-on-error: true
        run: |
          pip install -q pip-audit
          pip-audit -r backend/requirements.txt | tee -a "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build and Push ECS Images
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    concurrency:
      group: ecr-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}-${{ github.sha }}
      cancel-in-progress: false
    needs: [test, gitleaks]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validar plantillas .env (validate_envs.py)
        run: python3 scripts/validacion/validate_envs.py

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up publisher Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish immutable SHA images
        env:
          IMAGE_TAG: ${{ github.sha }}
          BUILD_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
        run: |
          test -n "$AWS_ACCOUNT_ID" || { echo 'Falta la variable vars.AWS_ACCOUNT_ID'; exit 1; }
          case "$BUILD_ENVIRONMENT" in
            staging) aws_environment=staging ;;
            production)
              test "$GITHUB_REF" = refs/heads/main || { echo 'Producción requiere main'; exit 1; }
              aws_environment=prod ;;
            *) echo 'Ambiente inválido'; exit 1 ;;
          esac
          python3 scripts/despliegue/build_and_push_ecr_images.py \
            --environment "$aws_environment" --from-ssm \
            --account "$AWS_ACCOUNT_ID" --region "$AWS_REGION" \
            --tag "$IMAGE_TAG" --manifest "$RUNNER_TEMP/ecr-manifest.json"

      - name: Preserve publication evidence including partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecr-manifest-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ecr-manifest.json
          if-no-files-found: warn
