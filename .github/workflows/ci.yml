name: CI

# Solo revisa el código. No entra a AWS, no publica imágenes y no despliega:
# publicar y desplegar se hace a mano (docs/produccion/despliegue/GUIA_DESPLIEGUE_LOCAL.md).
# Por eso no usa variables, secretos ni roles: corre igual en un PR que en main.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Lectura del repositorio y nada más (sin id-token: no puede pedir credenciales de AWS).
permissions:
  contents: read

# Un push nuevo al mismo PR cancela la revisión anterior; en main cada commit se revisa entero.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secretos:
    # Los nombres de los jobs son los que se marcan como obligatorios en la protección de main.
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo: gitleaks revisa todos los commits, no solo el último
          persist-credentials: false

      - name: Gitleaks
        # Imagen fijada por versión y digest (v8.30.1). Para actualizar: revisar
        # hub.docker.com/r/zricethezav/gitleaks/tags y reemplazar tag + digest juntos.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source="/repo" --redact -v

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Validar plantillas .env
        run: python scripts/validacion/validate_envs.py

      - name: Pruebas (pytest)
        run: python -m pytest -q

      - name: Revisar librerías con fallas conocidas (pip-audit, informativo)
        # No bloquea: hay vulnerabilidades conocidas sin corrección disponible.
        # El detalle queda en el resumen del job.
        continue-on-error: true
        run: |
          pip install -q pip-audit
          pip-audit -r backend/requirements.txt | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # la misma versión que usan los Dockerfile del frontend
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Pruebas del formulario público (vitest)
        run: npm --prefix apps/formulario-publico test

      - name: Compilar formulario público
        run: npm run build:publico

      - name: Compilar portal interno
        run: npm run build:portal

      - name: Revisar librerías con fallas conocidas (npm audit, informativo)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high | tee -a "$GITHUB_STEP_SUMMARY"

  infraestructura:
    name: Infraestructura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/sagrilaft
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/sagrilaft/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos (tsc)
        run: npx tsc --noEmit -p .

      - name: Pruebas de infraestructura
        run: node --test -r ts-node/register test/*.test.ts

      - name: Generar plantillas de staging y producción sin AWS (cdk synth)
        # Comprueba que la infraestructura se puede generar con el contexto completo de cada
        # ambiente. --no-lookups impide cualquier consulta a AWS. Cuenta, zona, certificado y
        # correos son ficticios; las zonas de disponibilidad que CDK pediría a AWS se dan en
        # cdk.context.json, que no está versionado y aquí solo vive dentro del runner.
        run: |
          export CUENTA_AWS=123456789012
          test ! -e cdk.context.json || { echo 'cdk.context.json ya existe: revisar este paso'; exit 1; }
          echo '{"availability-zones:account=123456789012:region=us-east-1":["us-east-1a","us-east-1b","us-east-1c"]}' > cdk.context.json
          export HOSTED_ZONE_ID=Z000000000CI
          export CERTIFICATE_ARN="arn:aws:acm:us-east-1:${CUENTA_AWS}:certificate/00000000-0000-0000-0000-000000000000"
          export ALERTAS_STAGING=ci@example.com
          export ALERTAS_CORTE=ci@example.com
          npm run --silent synth:staging -- --no-lookups -q -o "$RUNNER_TEMP/cdk-staging"
          npm run --silent synth:prod -- --no-lookups -q -o "$RUNNER_TEMP/cdk-prod"

      - name: Revisar librerías con fallas conocidas (npm audit, informativo)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high | tee -a "$GITHUB_STEP_SUMMARY"
