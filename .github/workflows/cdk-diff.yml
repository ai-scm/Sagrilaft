name: CI - CDK Diff

on:
  pull_request:
    paths:
      - 'infra/sagrilaft/**'
      - '.github/workflows/cdk-diff.yml'

permissions:
  contents: read
  id-token: write       # Requerido para OIDC de AWS
  pull-requests: write  # Requerido para comentar en el PR

env:
  AWS_REGION: us-east-1

jobs:
  cdk-diff:
    name: CDK Diff Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "infra/sagrilaft/package-lock.json"

      - name: Install dependencies
        working-directory: infra/sagrilaft
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run CDK Diff
        id: diff
        working-directory: infra/sagrilaft
        run: |
          # Se ejecuta con --no-color para que el diff en Markdown se lea limpio.
          # Usamos || true porque cdk diff retorna exit code 1 si hay diferencias,
          # y no queremos que el pipeline aborte aquí.
          npm run diff:staging -- --no-color > cdk_diff.log 2>&1 || true
          
          # Imprimimos el diff en la consola de GitHub Actions para depuración manual
          cat cdk_diff.log
          
          # Pasamos el output a una variable multi-línea de GitHub.
          # Limitamos a 60,000 caracteres para evitar romper el límite de GitHub para comentarios (65536).
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "diff_output<<$EOF" >> $GITHUB_OUTPUT
          head -c 60000 cdk_diff.log >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const diffOutput = `${{ steps.diff.outputs.diff_output }}`;
            
            const body = `### 🔍 Reporte de \`cdk diff\` (Staging)
            
            <details>
            <summary>Ver detalle de cambios en infraestructura</summary>
            
            \`\`\`diff
            ${diffOutput}
            \`\`\`
            </details>
            
            *Nota: Este diff usa la configuración de **Staging** para comparar los cambios.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
