name: CI - CDK Diff

on:
  pull_request:
    paths:
      - 'infra/sagrilaft/**'
      - '.github/workflows/cdk-diff.yml'

permissions:
  contents: read
  id-token: write       # Requerido para OIDC de AWS
  pull-requests: write  # Requerido para comentar en el PR

env:
  AWS_REGION: us-east-1

jobs:
  cdk-diff:
    name: CDK Diff Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "infra/sagrilaft/package-lock.json"

      - name: Install dependencies
        working-directory: infra/sagrilaft
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run CDK Diff
        id: diff
        working-directory: infra/sagrilaft
        env:
          CUENTA_AWS: ${{ vars.AWS_ACCOUNT_ID }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          ALERTAS_STAGING: ${{ secrets.ALERTAS_STAGING }}
        run: |
          for v in CUENTA_AWS HOSTED_ZONE_ID CERTIFICATE_ARN ALERTAS_STAGING; do
            if [ -z "${!v}" ]; then echo "Falta $v (variable o secreto de GitHub)"; exit 1; fi
          done
          # Se ejecuta con --no-color para que el diff en Markdown se lea limpio.
          # diff:staging NO pasa --fail, así que cdk diff devuelve 0 aunque haya
          # diferencias de infraestructura; un código distinto de 0 aquí es un error
          # real (fallo de síntesis, credenciales, contexto faltante), no un diff normal.
          # Se captura el código para fallar el job más abajo, después de comentar en el PR.
          set +e
          npm run diff:staging -- --no-color > cdk_diff.log 2>&1
          echo "diff_exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

          # Imprimimos el diff en la consola de GitHub Actions para depuración manual
          cat cdk_diff.log

          # Pasamos el output a una variable multi-línea de GitHub.
          # Limitamos a 60,000 caracteres para evitar romper el límite de GitHub para comentarios (65536).
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "diff_output<<$EOF" >> $GITHUB_OUTPUT
          head -c 60000 cdk_diff.log >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const diffOutput = `${{ steps.diff.outputs.diff_output }}`;
            
            const body = `### 🔍 Reporte de \`cdk diff\` (Staging)
            
            <details>
            <summary>Ver detalle de cambios en infraestructura</summary>
            
            \`\`\`diff
            ${diffOutput}
            \`\`\`
            </details>
            
            *Nota: Este diff usa la configuración de **Staging** para comparar los cambios.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

      - name: Fallar si cdk diff tuvo un error real
        if: steps.diff.outputs.diff_exit_code != '0'
        run: |
          echo "cdk diff terminó con código ${{ steps.diff.outputs.diff_exit_code }}."
          echo "Esto no es un diff normal con cambios: con diff:staging, cdk diff solo falla ante un error real (ver el log arriba o el comentario del PR)."
          exit 1
