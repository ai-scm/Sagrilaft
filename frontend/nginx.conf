server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Límite de tamaño de uploads (PDFs, imágenes de documentos)
    client_max_body_size 20m;

    # Compresión: reduce el bundle de React de ~500KB a ~150KB en tránsito
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/html
        text/css
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cabeceras de seguridad estándar
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # CSP: 'unsafe-inline' en style-src es necesario por los estilos inline de React.
    # connect-src incluye https: para permitir llamadas al servidor Keycloak (URL
    # variable por entorno). Reemplaza https: por la URL exacta de Keycloak en producción.
    add_header Content-Security-Policy
        "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"
        always;

    # Proxy /api → backend interno (preserva el prefijo que FastAPI espera)
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA: cualquier ruta desconocida carga index.html y React Router la maneja
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (generados por Vite) → caché permanente
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
