server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Límite de tamaño de uploads
    client_max_body_size 20m;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cabeceras de seguridad
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # CSP con connect-src más permisivo para Keycloak
    add_header Content-Security-Policy
        "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"
        always;

    # SPA: cualquier ruta desconocida carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash → caché permanente
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
